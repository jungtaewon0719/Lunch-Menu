<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안산동산고 점심 식단</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100vw;
    height:100vh;
    background-color:#fff6e9;
    color:#2c2420;
    font-family:"Malgun Gothic","Noto Sans KR",sans-serif;
    overflow:hidden;
  }
  .wrap { width:100vw; height:100vh; position:relative; }

  .banner {
    width:100vw;
    padding:8.1vw 6.7vw 5.9vw 6.7vw;
    background-color:#e2502c;
    color:#fff8f0;
  }
  .icon { width:8vw; height:8vw; margin-bottom:2.5vw; display:block; }
  .school { font-size:2.8vw; letter-spacing:0.3vw; font-weight:bold; }
  .badge { margin-top:1.8vw; font-size:5.2vw; font-weight:bold; line-height:1.25; }
  .date { margin-top:1.3vw; font-size:2.8vw; font-weight:bold; }

  .menu { padding:5.2vw 6vw 3.7vw 6vw; }
  .dish {
    background-color:#ffffff;
    border:0.1vw solid #e6ddcf;
    padding:3.3vw 3.7vw;
    margin-bottom:2.4vw;
  }
  .dish .num {
    display:inline-block;
    width:5.2vw;
    height:5.2vw;
    line-height:5.2vw;
    text-align:center;
    background-color:#fbecd3;
    color:#e2502c;
    font-size:2.4vw;
    font-weight:bold;
    border-radius:2.6vw;
  }
  .dish .name {
    display:inline-block;
    vertical-align:middle;
    margin-left:2.2vw;
    font-size:4.3vw;
    font-weight:bold;
    color:#2c2420;
  }
  .empty {
    font-size:3.1vw;
    color:#8a7f70;
    text-align:center;
    padding:5.6vw 2vw;
    font-weight:bold;
  }
  .footer {
    padding:1.9vw 6vw;
    font-size:2.2vw;
    color:#8a7f70;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="banner">
      <svg class="icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 30C8 17 18 8 32 8C46 8 56 17 56 30" stroke="#fff8f0" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="32" cy="44" rx="26" ry="9" fill="#fff8f0"/>
        <path d="M11 44V38C11 30 20 24 32 24C44 24 53 30 53 38V44" stroke="#fff8f0" stroke-width="4" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="school">안산동산고등학교</div>
      <div class="badge" id="badge">불러오는 중...</div>
      <div class="date" id="dateLine"></div>
    </div>
    <div class="menu" id="menu"><div class="empty">급식 정보를 불러오는 중입니다...</div></div>
    <div class="footer" id="updatedAt"></div>
  </div>

<script>
/* ===================== 설정 (여기만 바꾸면 됩니다) ===================== */
var API_KEY   = "d1c3ab94e6bc4499929101c2f8cb1fbf";
var OFFICE    = "J10";
var SCHOOL_NM = "안산동산고등학교";
var SWITCH_HOUR = 14;
var CHECK_INTERVAL_MS = 5 * 60 * 1000;
/* ====================================================================== */

function pad(n){ n = String(n); return n.length < 2 ? "0" + n : n; }

function ymd(d){
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
}
function prettyDate(d){
  var days = ["일","월","화","수","목","금","토"];
  return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + days[d.getDay()] + ")";
}
function addDays(d, n){
  var r = new Date(d.getTime());
  r.setDate(r.getDate() + n);
  return r;
}

function httpGetJson(url, onSuccess, onError){
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function(){
    if(xhr.readyState === 4){
      if(xhr.status === 200){
        try{
          var data = JSON.parse(xhr.responseText);
          onSuccess(data);
        }catch(e){
          onError(e);
        }
      } else {
        onError(new Error("HTTP " + xhr.status));
      }
    }
  };
  xhr.onerror = function(){ onError(new Error("network error")); };
  xhr.send();
}

function getSchoolCode(callback, errback){
  var cached = null;
  try{ cached = localStorage.getItem("school_code_cache"); }catch(e){}
  if(cached){
    try{
      callback(JSON.parse(cached));
      return;
    }catch(e){}
  }
  var url = "https://open.neis.go.kr/hub/schoolInfo?KEY=" + API_KEY +
            "&Type=json&ATPT_OFCDC_SC_CODE=" + OFFICE +
            "&SCHUL_NM=" + encodeURIComponent(SCHOOL_NM);
  httpGetJson(url, function(data){
    try{
      var row = data.schoolInfo[1].row[0];
      var info = { office: row.ATPT_OFCDC_SC_CODE, code: row.SD_SCHUL_CODE };
      try{ localStorage.setItem("school_code_cache", JSON.stringify(info)); }catch(e){}
      callback(info);
    }catch(e){
      errback(e);
    }
  }, errback);
}

function fetchLunch(office, code, dateObj, callback, errback){
  var url = "https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=" + API_KEY +
            "&Type=json&ATPT_OFCDC_SC_CODE=" + office +
            "&SD_SCHUL_CODE=" + code +
            "&MLSV_YMD=" + ymd(dateObj) +
            "&MMEAL_SC_CODE=2";
  httpGetJson(url, function(data){
    if(!data.mealServiceDietInfo){
      callback(null);
      return;
    }
    try{
      var raw = data.mealServiceDietInfo[1].row[0].DDISH_NM;
      var parts = raw.split("<br/>");
      var dishes = [];
      for(var i=0; i<parts.length; i++){
        var s = parts[i].replace(/\([0-9.\s]+\)/g, "");
        s = s.replace(/^\s+|\s+$/g, "");
        if(s) dishes.push(s);
      }
      callback(dishes);
    }catch(e){
      errback(e);
    }
  }, errback);
}

function render(label, dateObj, dishes){
  document.getElementById("badge").innerHTML = label;
  document.getElementById("dateLine").innerHTML = prettyDate(dateObj);
  var menuEl = document.getElementById("menu");
  if(dishes && dishes.length){
    var html = "";
    for(var i=0; i<dishes.length; i++){
      html += '<div class="dish"><span class="num">' + (i+1) + '</span><span class="name">' + dishes[i] + '</span></div>';
    }
    menuEl.innerHTML = html;
  } else {
    menuEl.innerHTML = '<div class="empty">이 날은 급식 정보가 없습니다.<br>(주말 또는 휴일일 수 있어요)</div>';
  }
  var now = new Date();
  document.getElementById("updatedAt").innerHTML = "업데이트 " + pad(now.getHours()) + ":" + pad(now.getMinutes());
}

function showError(){
  document.getElementById("badge").innerHTML = "오류가 발생했습니다";
  document.getElementById("menu").innerHTML = '<div class="empty">API 키 또는 네트워크 상태를 확인해주세요.</div>';
}

function tryNextDay(office, code, target, tries){
  if(tries >= 6){
    render("다음 급식일 안내", target, null);
    return;
  }
  var next = addDays(target, 1);
  fetchLunch(office, code, next, function(dishes){
    if(dishes && dishes.length){
      render("다음 급식일 안내", next, dishes);
    } else {
      tryNextDay(office, code, next, tries + 1);
    }
  }, function(){
    showError();
  });
}

function refresh(){
  getSchoolCode(function(info){
    var office = info.office;
    var code = info.code;
    var now = new Date();
    var showTomorrow = now.getHours() >= SWITCH_HOUR;
    var target = showTomorrow ? addDays(now, 1) : now;
    var baseLabel = showTomorrow ? "내일의 점심 식단" : "오늘의 점심 식단";

    fetchLunch(office, code, target, function(dishes){
      if(dishes && dishes.length){
        render(baseLabel, target, dishes);
      } else {
        tryNextDay(office, code, target, 0);
      }
    }, function(){
      showError();
    });
  }, function(){
    showError();
  });
}

refresh();
setInterval(refresh, CHECK_INTERVAL_MS);
</script>
</body>
</html>
