<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>안산동산고 점심 식단</title>
<style>
  @font-face{
    font-family:"Pretendard";
    src:local("Pretendard");
  }
  :root{
    --cream: #fff6e9;
    --cream-deep: #fbecd3;
    --charcoal: #2c2420;
    --coral: #ff6b45;
    --coral-deep: #e2502c;
    --basil: #57794a;
    --gold: #e8a23b;
    --line: rgba(44,36,32,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:1080px; height:1920px;
    background:var(--cream);
    color:var(--charcoal);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    overflow:hidden;
  }
  .wrap{
    display:flex; flex-direction:column;
    height:100%;
  }

  /* ---- 상단 배너 ---- */
  .banner{
    position:relative;
    background:linear-gradient(160deg, var(--coral) 0%, var(--coral-deep) 100%);
    padding:88px 72px 64px 72px;
    color:#fff8f0;
    overflow:hidden;
  }
  .banner::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:64px;
    background:var(--cream);
    border-radius:60px 60px 0 0;
  }
  .icon{
    width:88px; height:88px; margin-bottom:28px;
  }
  .school{
    font-size:30px; letter-spacing:3px; font-weight:700; opacity:0.9;
  }
  .badge{
    margin-top:20px; font-size:58px; font-weight:800; line-height:1.25;
  }
  .date{
    margin-top:14px; font-size:30px; font-weight:600; opacity:0.92;
  }

  /* ---- 메뉴 영역 ---- */
  .menu{
    flex:1; padding:56px 64px 40px 64px;
    display:flex; flex-direction:column; justify-content:center;
    gap:26px;
  }
  .dish{
    display:flex; align-items:center; gap:28px;
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:28px;
    padding:38px 40px;
    box-shadow:0 10px 26px rgba(226,80,44,0.07);
  }
  .dish .num{
    flex:0 0 auto;
    width:64px; height:64px; border-radius:50%;
    background:var(--cream-deep);
    color:var(--coral-deep);
    font-size:28px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .dish .name{
    font-size:48px; font-weight:700; line-height:1.3; color:var(--charcoal);
  }
  .empty{
    font-size:36px; color:rgba(44,36,32,0.55); line-height:1.7;
    text-align:center; padding:60px 20px; font-weight:600;
  }

  /* ---- 하단 ---- */
  .footer{
    padding:0 64px 56px 64px;
    font-size:24px; color:rgba(44,36,32,0.45); font-weight:600;
    display:flex; justify-content:space-between; align-items:center;
  }
  .footer .tag{
    background:var(--basil); color:#fff;
    padding:8px 20px; border-radius:100px; font-size:22px; font-weight:700;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="banner">
      <svg class="icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 30C8 17 18 8 32 8C46 8 56 17 56 30" stroke="#fff8f0" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="32" cy="44" rx="26" ry="9" fill="#fff8f0"/>
        <path d="M11 44V38C11 30 20 24 32 24C44 24 53 30 53 38V44" stroke="#fff8f0" stroke-width="4" stroke-linejoin="round" fill="none"/>
        <path d="M22 12C22 8 25 6 25 6M32 10C32 6 35 3 35 3M42 12C42 8 45 6 45 6" stroke="#fff8f0" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <div class="school">안산동산고등학교</div>
      <div class="badge" id="badge">불러오는 중…</div>
      <div class="date" id="dateLine"></div>
    </div>

    <div class="menu" id="menu"><div class="empty">급식 정보를 불러오는 중입니다…</div></div>

    <div class="footer">
      <span id="updatedAt"></span>
      <span class="tag">오늘도 맛있게!</span>
    </div>
  </div>

<script>
/* ===================== 설정 (여기만 바꾸면 됩니다) ===================== */
const API_KEY   = "d1c3ab94e6bc4499929101c2f8cb1fbf";   // open.neis.go.kr 에서 발급받은 인증키
const OFFICE    = "J10";                 // 경기도교육청 코드 (고정값)
const SCHOOL_NM = "안산동산고등학교";      // 학교명
const SWITCH_HOUR = 14;                  // 이 시각(24시간제) 이후엔 '내일' 급식으로 전환
const CHECK_INTERVAL_MS = 5 * 60 * 1000; // 5분마다 재확인 (자정/오후2시 경계 대응)
/* ====================================================================== */

const el = {
  badge: document.getElementById('badge'),
  dateLine: document.getElementById('dateLine'),
  menu: document.getElementById('menu'),
  updatedAt: document.getElementById('updatedAt'),
};

function ymd(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}${m}${day}`;
}
function prettyDate(d){
  const days=['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }

async function getSchoolCode(){
  const cached = localStorage.getItem('school_code_cache');
  if(cached) return JSON.parse(cached);
  const url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${OFFICE}&SCHUL_NM=${encodeURIComponent(SCHOOL_NM)}`;
  const res = await fetch(url);
  const data = await res.json();
  const row = data.schoolInfo[1].row[0];
  const info = { office: row.ATPT_OFCDC_SC_CODE, code: row.SD_SCHUL_CODE };
  localStorage.setItem('school_code_cache', JSON.stringify(info));
  return info;
}

async function fetchLunch(office, code, dateObj){
  const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${office}&SD_SCHUL_CODE=${code}&MLSV_YMD=${ymd(dateObj)}&MMEAL_SC_CODE=2`;
  const res = await fetch(url);
  const data = await res.json();
  if(!data.mealServiceDietInfo) return null; // 해당일 급식 없음(주말/휴일 등)
  const raw = data.mealServiceDietInfo[1].row[0].DDISH_NM;
  return raw.split('<br/>').map(s => s.replace(/\([0-9.\s]+\)/g,'').trim()).filter(Boolean);
}

function render(label, dateObj, dishes){
  el.badge.textContent = label;
  el.dateLine.textContent = prettyDate(dateObj);
  if(dishes && dishes.length){
    el.menu.innerHTML = dishes.map((d,i) => `
      <div class="dish">
        <div class="num">${i+1}</div>
        <div class="name">${d}</div>
      </div>
    `).join('');
  } else {
    el.menu.innerHTML = `<div class="empty">이 날은 급식 정보가 없습니다.<br>(주말 또는 휴일일 수 있어요)</div>`;
  }
  el.updatedAt.textContent = '업데이트 ' + new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
}

async function refresh(){
  try{
    const { office, code } = await getSchoolCode();
    const now = new Date();
    const showTomorrow = now.getHours() >= SWITCH_HOUR;
    let target = showTomorrow ? addDays(now,1) : now;
    const baseLabel = showTomorrow ? '내일의 점심 식단' : '오늘의 점심 식단';

    // 주말/휴일이라 급식이 없으면 최대 6일 뒤까지 다음 급식일을 찾아 대체 표시
    let dishes = await fetchLunch(office, code, target);
    let label = baseLabel;
    let tries = 0;
    while(!dishes && tries < 6){
      target = addDays(target, 1);
      dishes = await fetchLunch(office, code, target);
      label = '다음 급식일 안내';
      tries++;
    }
    render(label, target, dishes);
  }catch(e){
    el.badge.textContent = '오류가 발생했습니다';
    el.menu.innerHTML = `<div class="empty">API 키 또는 네트워크 상태를 확인해주세요.</div>`;
    console.error(e);
  }
}

refresh();
setInterval(refresh, CHECK_INTERVAL_MS);
</script>
</body>
</html>
